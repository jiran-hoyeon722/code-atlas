<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Atlas</title>
<style>
:root { --bg: #0b0f17; --panel: rgba(22, 28, 40, 0.72); --line: rgba(255, 255, 255, 0.08); --text: #e6e9ef; --muted: #8b93a3; --accent: #4c6ef5; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: radial-gradient(1200px 600px at 20% -10%, #1a2340 0%, var(--bg) 60%); color: var(--text); font: 14px/1.6 -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', sans-serif; }
main { max-width: 1080px; margin: 0 auto; padding: 48px 16px; }
h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -0.02em; }
.lead { margin: 0 0 32px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.card { padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); backdrop-filter: blur(12px); }
.card h2 { margin: 0; font-size: 18px; }
.card .sub { margin: 2px 0 14px; color: var(--muted); font-size: 12px; }
.stats { display: flex; gap: 18px; margin-bottom: 16px; }
.stats b { display: block; font-size: 18px; }
.stats span { color: var(--muted); font-size: 12px; }
.views { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.views a { padding: 6px 12px; border-radius: 8px; background: rgba(76, 110, 245, 0.16); color: #c5d0ff; text-decoration: none; font-weight: 600; }
.views a:first-child { background: var(--accent); color: #fff; }
.views a:hover { filter: brightness(1.15); }
details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
details ul { margin: 8px 0 0; padding-left: 18px; }
details a { color: #a5b4fc; }
.empty { padding: 24px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); }
code { padding: 1px 6px; border-radius: 4px; background: rgba(255, 255, 255, 0.06); }
</style>
</head>
<body>
<main>
    <h1>Code Atlas</h1>
    <p class="lead">레포별 의존성·소스 구조 지도. 각 카드에서 3D 도시, 3D 그래프, 아키텍처 탐색기, CodeCharta 지도로 들어가요.</p>
    <div id="repos" class="grid"></div>
</main>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => Number(n).toLocaleString('ko-KR');
const empty = (message) => { document.querySelector('#repos').outerHTML = `<p class="empty">${message}</p>`; };

fetch('repos.json')
    .then((r) => (r.ok ? r.json() : []))
    .then((repos) => {
        if (!repos.length) {
            return empty('아직 빌드한 레포가 없어요. <code>repos/&lt;name&gt;.json</code> 을 만들고 <code>tools/codecity/build.sh &lt;name&gt;</code> 을 실행하세요.');
        }
        document.querySelector('#repos').innerHTML = repos.map((repo) => `
            <section class="card">
                <h2>${esc(repo.title)}</h2>
                <p class="sub">${esc(repo.name)} · ${esc(repo.language)} · ${esc(repo.sourceDir)}/ · 생성 ${esc(new Date(repo.generatedAt).toLocaleString('ko-KR'))}</p>
                <div class="stats">
                    <div><b>${fmt(repo.files)}</b><span>파일</span></div>
                    <div><b>${fmt(repo.edges)}</b><span>참조</span></div>
                    <div><b>${fmt(repo.upward)}</b><span>역방향 의존</span></div>
                </div>
                <div class="views">
                    <a href="${esc(repo.name)}/city.html">3D 의존성 도시</a>
                    <a href="${esc(repo.name)}/graph.html">3D 그래프</a>
                    <a href="${esc(repo.name)}/explorer.html">아키텍처 탐색기</a>
                </div>
                <details>
                    <summary>CodeCharta 지도 프리셋 ${repo.presets.length}개 · 핫스팟 리포트</summary>
                    <ul>
                        ${repo.presets.map((p) => `<li><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a></li>`).join('')}
                        <li><a href="${esc(repo.name)}/hotspots.md" target="_blank" rel="noopener">hotspots.md</a> · <a href="${esc(repo.name)}/hotspots.csv">hotspots.csv</a></li>
                    </ul>
                </details>
            </section>`).join('');
    })
    .catch((e) => empty(`repos.json 을 불러오지 못했어요 (${esc(e.message)}).`));
</script>
</body>
</html>
